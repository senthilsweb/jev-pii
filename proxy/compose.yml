# Homelab: the proxy behind your own TLS reverse proxy (the page is https, so the proxy must be too).
services:
  jev-proxy:
    image: ghcr.io/senthilsweb/jev-proxy:latest
    restart: unless-stopped
    env_file: .env                  # TYPESAFE_API_KEY, PROXY_SECRET, ALLOWED_ORIGINS ... (see .env.example)
    ports: ["127.0.0.1:8080:8080"]  # only the reverse proxy reaches it
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
